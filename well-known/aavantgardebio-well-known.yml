source: >-
  Direct unauthenticated GET of the RFC 8615 named path list against every host this
  record knows: the registrable domain (aavantgarde.com), www, and the corporate site
  host. AAVantgarde Bio publishes no API, so there is no API baseURL host and no
  OpenAPI servers[] host to probe.
note: >-
  Three paths return real documents on www.aavantgarde.com. All three are emitted by
  the corporate website's CMS (Umbraco), not by a developer API: the OpenID discovery
  document describes Umbraco's Delivery API *member* authentication endpoints
  (/umbraco/delivery/api/v1/security/member/...), which exist to authenticate website
  members, and the JWKS is that authorization server's signing key set. The
  security.txt is real RFC 9116 but is EXPIRED (Expires 2026-01-01, probed 2026-09-05)
  and its Contact is the web agency that built the site (sampsonmay.com), not an
  AAVantgarde security team. Recorded as served documents; not evidence of a public
  API program.

