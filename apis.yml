aid: aavantgardebio
name: AAVantgarde Bio
description: >-
  AAVantgarde Bio is a clinical-stage biotechnology company headquartered in Milan,
  Italy, developing next-generation adeno-associated virus (AAV) gene therapies for
  inherited retinal diseases with high unmet need. Founded in 2021 by Prof. Alberto
  Auricchio, the company has built two proprietary vector platforms — dual hybrid and
  dual intein — that overcome the DNA cargo capacity limit of a single AAV vector by
  splitting a large expression cassette across two AAV8 vectors that recombine inside
  the target cell. Its lead programs are AAVB-081 for retinitis pigmentosa due to Usher
  syndrome type 1B (LUCE-1 Phase 1/2, the first dual AAV gene therapy tested clinically
  in an ocular indication) and AAVB-039 for ABCA4-associated Stargardt disease (CELESTE
  Phase 1/2), which holds FDA Fast Track and Orphan Drug designation. The company
  raised a EUR 61 million Series A and closed a USD 141 million Series B. AAVantgarde
  publishes no public API, developer program or machine-readable contract; this profile
  records what its public web surface actually serves.
